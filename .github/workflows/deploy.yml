name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Caches the Chromium binary only. `pnpm build` still runs
      # `playwright install --with-deps`, which is what installs the shared
      # libraries Chromium needs to launch — the step Cloudflare's rootless
      # builder cannot perform, and the reason mermaid posts rendered empty
      # there.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm build

      # Same command as the manual fallback. The major is pinned because
      # wrangler 3 has no assets-only deploy and rejects `wrangler.jsonc` for
      # having no `main` entry-point.
      - run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
